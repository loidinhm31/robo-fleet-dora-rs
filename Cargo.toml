[workspace]
resolver = "2"
members = [
    # Shared library
    "robo_rover_lib",

    # Common - Multi-target nodes (orchestra + rover)
    "common/web_bridge",

    # Orchestra (Workstation) - Fleet control hub
    "rover-kiwi/object_detector",
    "rover-kiwi/object_tracker",
    "orchestra/central_speech_recognizer",
    "orchestra/command_parser",
    "orchestra/zenoh_bridge",
    "orchestra/kokoro_tts",

    # Rover-kiwi - On-robot nodes
    "rover-kiwi/rover_controller",
    "rover-kiwi/arm_controller",
    "rover-kiwi/kornia_capture",
    "rover-kiwi/video_encoder",
    "rover-kiwi/audio_capture",
    "rover-kiwi/audio_converter",
    "rover-kiwi/audio_playback",
    "rover-kiwi/visual_servo_controller",
    "rover-kiwi/edge_voice",
    "rover-kiwi/performance_monitor",
    "rover-kiwi/zenoh_bridge",
    "rover-kiwi/dispatcher_keyboard",
    "rover-kiwi/reid_extractor",
    "rover-kiwi/sim_interface",
]

[workspace.dependencies]
# Shared dependencies across all workspace members
dora-node-api = "0.5.0"
dora-core = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
nalgebra = "0.33"
eyre = "0.6.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }
zenoh = "1.0"
zenoh-config = "1.0"

[patch.crates-io]
espeak-rs-sys = { path = "third_party/espeak-rs-sys" }
