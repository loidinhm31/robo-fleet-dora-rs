nodes:
  # Audio capture - microphone input
  - id: audio-capture
    build: cargo build --release -p audio_capture
    path: ../target/release/audio_capture
    inputs:
      tick:
        source: dora/timer/millis/50  # 20 Hz
        queue_size: 1
      audio_control:
        source: web-bridge/audio_command
        queue_size: 8
      playback_state:
        source: audio-playback/playback_state
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - audio  # Float32 audio data
      - lifecycle_component_status
    env:
      SAMPLE_RATE: "16000"
      CHANNELS: "1"  # preserve downstream mono contract; multichannel mics are downmixed in audio_capture
      CHUNK_SIZE: "800"
      AUDIO_DEVICE: "${AUDIO_DEVICE:-sysdefault:CARD=Camera}"
  # Audio playback - sole speaker owner for walkie and rover TTS.
  - id: audio-playback
    build: cargo build --release -p audio_playback
    path: ../target/release/audio_playback
    inputs:
      tick:
        source: dora/timer/millis/20
        queue_size: 1
      walkie_audio:
        source: web-bridge/audio_stream
        queue_size: 4
      tts_audio:
        source: edge-voice/tts_audio
        queue_size: 4
      tts_synthesis_state:
        source: edge-voice/tts_synthesis_state
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - playback_state
      - walkie_state
      - playback_audio
      - playback_result
      - lifecycle_component_status
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      PLAYBACK_VOLUME: "1.0"

  # Edge voice - rover-side Supertonic synthesis.
  - id: edge-voice
    build: cargo build --release -p edge_voice
    path: ../target/release/edge_voice
    inputs:
      tts_command:
        source: web-bridge/tts_command
        queue_size: 8
      tts_config_command:
        source: web-bridge/tts_config_command
        queue_size: 8
      playback_state:
        source: audio-playback/walkie_state
        queue_size: 8
      playback_result:
        source: audio-playback/playback_result
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - tts_audio
      - tts_synthesis_state
      - voice_status
      - tts_command_result
      - metrics
      - lifecycle_component_status
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      EDGE_VOICE_MODEL_DIR: "${EDGE_VOICE_MODEL_DIR:-models/.cache/sherpa-onnx/tts/sherpa-onnx-supertonic-3-tts-int8-2026-05-11}"
      EDGE_VOICE_NUM_THREADS: "2"
      EDGE_VOICE_QUEUE_CAPACITY: "8"
      TTS_DEFAULT_LANGUAGE: "en"
      TTS_DEFAULT_SPEAKER_ID: "5"
      TTS_DEFAULT_SPEED: "1.0"
      TTS_DEFAULT_STEPS: "8"
      TTS_DEFAULT_VOLUME: "0.8"

  # Resource monitor stays active while workload nodes pause.
  - id: resource-monitor
    build: cargo build --release -p resource_monitor
    path: ../target/release/resource_monitor
    inputs:
      tick: dora/timer/millis/5000
    outputs:
      - resource_snapshot
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      RESOURCE_MONITOR_ROLE: "rover"
      RESOURCE_MONITOR_SCOPE: "${RESOURCE_MONITOR_SCOPE:-}"
      RESOURCE_MONITOR_NODES: '[{"node_id":"audio-capture","executable":"audio_capture","domain_id":"audio-capture"},{"node_id":"audio-converter","executable":"audio_converter"},{"node_id":"edge-voice","executable":"edge_voice","domain_id":"edge-voice"},{"node_id":"audio-playback","executable":"audio_playback","domain_id":"audio-playback"},{"node_id":"gst-camera","executable":"kornia_capture","domain_id":"gst-camera"},{"node_id":"video-encoder","executable":"video_encoder"},{"node_id":"visual-servo-controller","executable":"visual_servo_controller"},{"node_id":"arm-controller","executable":"arm_controller"},{"node_id":"rover-controller","executable":"rover_controller"},{"node_id":"web-bridge","executable":"web_bridge"}]'

  - id: power-coordinator
    build: cargo build --release -p power_coordinator
    path: ../target/release/power_coordinator
    inputs:
      resource_snapshot: resource-monitor/resource_snapshot
      lifecycle_status:
        source: lifecycle-manager/lifecycle_status
        queue_size: 64
      lifecycle_command_result: lifecycle-manager/lifecycle_command_result
      tick: dora/timer/millis/1000
    outputs:
      - lifecycle_command
      - lifecycle_status_query
      - power_status
      - power_transition
      - power_command_result
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      POWER_COORDINATOR_ROLE: "rover"

  # Always-on authority for validated, acknowledged lifecycle transitions.
  - id: lifecycle-manager
    build: cargo build --release -p lifecycle_manager
    path: ../target/release/lifecycle_manager
    inputs:
      power_lifecycle_command: power-coordinator/lifecycle_command
      lifecycle_status_query_power: power-coordinator/lifecycle_status_query
      lifecycle_command: web-bridge/lifecycle_command
      lifecycle_status_query: web-bridge/lifecycle_status_query
      lifecycle_component_status_camera: gst-camera/lifecycle_component_status
      lifecycle_component_status_audio: audio-capture/lifecycle_component_status
      lifecycle_component_status_edge_voice: edge-voice/lifecycle_component_status
      lifecycle_component_status_audio_playback: audio-playback/lifecycle_component_status
      tick: dora/timer/millis/1000
    outputs:
      - lifecycle_command_result
      - lifecycle_status
      - lifecycle_capabilities
      - lifecycle_authorized_command
    env:
      RUST_LOG: info
      LIFECYCLE_CAPABILITIES: '[{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"gst-camera"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"audio-capture"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"edge-voice"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"audio-playback"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"web-bridge"},"supported":false,"always_on":true}]'

  # GStreamer camera capture + consolidated vision pipeline
  - id: gst-camera
    build: cargo build -p kornia_capture --release
    path: ../target/release/kornia_capture
    inputs:
      tick: dora/timer/millis/33  # ~30 FPS
      camera_control: web-bridge/camera_command
      stream_control: web-bridge/stream_command
      tracking_command: web-bridge/tracking_command
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
      autonomous_motion_safety_ack:
        source: rover-controller/autonomous_motion_safety_ack
        queue_size: 2
    outputs:
      - frame                  # 15 FPS raw RGB8 view branch for local JPEG encoding
      - detections             # DetectionFrame raw YOLO (detection-only mode)
      - tracked_detections     # DetectionFrame with tracking IDs
      - tracking_telemetry     # TrackingTelemetry
      - lifecycle_component_status
      - autonomous_motion_safety # Stop-and-hold request; camera waits for controller acknowledgement
    env:
      SOURCE_TYPE: "webcam"
      SOURCE_URI: "${ROVER_CAMERA_URI:-/dev/video0}"
      IMAGE_COLS: "640"
      IMAGE_ROWS: "480"
      SOURCE_FPS: "30"
      VIEW_STREAM_FPS: "15"
      MODEL_PATH: "${ROVER_YOLO_MODEL_PATH:-models/.cache/yolo/yolo12n.onnx}"
      CONFIDENCE_THRESHOLD: "0.5"
      NMS_THRESHOLD: "0.4"
      TARGET_CLASSES: ""
      DETECTOR_INTRA_THREADS: "2"
      # Default assumes a system-wide ONNX Runtime 1.16.x install.
      # Override ROVER_ORT_DYLIB_PATH when using an extracted local runtime.
      ORT_DYLIB_PATH: "${ROVER_ORT_DYLIB_PATH:-/usr/local/lib/libonnxruntime.so}"
      REID_MODEL_PATH: "${ROVER_REID_MODEL_PATH:-models/.cache/reid/osnet_x0_25.onnx}"
      MIN_BBOX_SIZE: "32"
      REID_INTRA_THREADS: "1"
      MAX_TRACKING_AGE: "50"
      MIN_HITS: "3"
      IOU_THRESHOLD: "0.3"
      REID_WEIGHT: "0.8"
      REID_THRESHOLD: "0.5"
      ENABLE_CMC: "true"

  - id: visual-servo-controller
    build: cargo build --release -p visual_servo_controller
    path: ../target/release/visual_servo_controller
    inputs:
      tracking_telemetry: gst-camera/tracking_telemetry
    outputs:
      - servo_command
      - servo_telemetry
    env:
      RUST_LOG: info
      LATERAL_PID_KP: "1.5"
      LATERAL_PID_KI: "0.0"
      LATERAL_PID_KD: "0.2"
      LONGITUDINAL_PID_KP: "0.8"
      LONGITUDINAL_PID_KI: "0.0"
      LONGITUDINAL_PID_KD: "0.15"
      MIN_DISTANCE: "1.0"
      MAX_VELOCITY: "0.5"
      MAX_ANGULAR_VELOCITY: "1.0"
      TARGET_BBOX_HEIGHT: "0.3"
      DEAD_ZONE: "0.05"

  # Arm controller
  - id: arm-controller
    build: cargo build --release -p arm_controller
    path: ../target/release/arm_controller
    inputs:
      arm_command: web-bridge/arm_command
    outputs:
      - processed_arm_command
    env:
      RUST_LOG: info
      ARM_CONFIG: config/arm_6dof.toml

  # Rover controller
  - id: rover-controller
    build: cargo build --release -p rover_controller
    path: ../target/release/rover_controller
    inputs:
      rover_command: web-bridge/rover_command
      servo_command: visual-servo-controller/servo_command
      autonomous_motion_safety:
        source: gst-camera/autonomous_motion_safety
        queue_size: 2
    outputs:
      - processed_rover_command
      - autonomous_motion_safety_ack # Controller acceptance/forwarding acknowledgement, not motor feedback
    env:
      RUST_LOG: info

  # Video encoder - JPEG compression for web streaming
  - id: video-encoder
    build: cargo build --release -p video_encoder
    path: ../target/release/video_encoder
    inputs:
      video_frame: gst-camera/frame
    outputs:
      - encoded_frame
    env:
      JPEG_QUALITY: "80"
      IMAGE_WIDTH: "640"
      IMAGE_HEIGHT: "480"

  # Audio converter - PCM format conversion for web streaming
  - id: audio-converter
    build: cargo build --release -p audio_converter
    path: ../target/release/audio_converter
    inputs:
      audio_input:
        source: audio-capture/audio
        queue_size: 4
    outputs:
      - audio_output
    env:
      OUTPUT_FORMAT: "int16"
      SAMPLE_RATE: "16000"
      CHANNELS: "1"

  # Web bridge - Direct browser access (no Zenoh required)
  - id: web-bridge
    build: cargo build --release -p web_bridge
    path: ../target/release/web_bridge
    inputs:
      video_frame: video-encoder/encoded_frame
      audio_frame:
        source: audio-converter/audio_output
        queue_size: 4
      playback_audio_frame:
        source: audio-playback/playback_audio
        queue_size: 4
      servo_telemetry: visual-servo-controller/servo_telemetry
      detections: gst-camera/detections
      tracked_detections: gst-camera/tracked_detections
      tracking_telemetry: gst-camera/tracking_telemetry
      resource_snapshot: resource-monitor/resource_snapshot
      lifecycle_command_result: lifecycle-manager/lifecycle_command_result
      # Preserve all safe-node statuses for the direct Socket.IO contract.
      lifecycle_status:
        source: lifecycle-manager/lifecycle_status
        queue_size: 64
      lifecycle_capabilities: lifecycle-manager/lifecycle_capabilities
      voice_status:
        source: edge-voice/voice_status
        queue_size: 8
      tts_command_result:
        source: edge-voice/tts_command_result
        queue_size: 8
    outputs:
      - rover_command
      - arm_command
      - camera_command
      - audio_command
      - stream_command
      - tracking_command
      - tts_command
      - tts_config_command
      - audio_stream
      - voice_command_audio
      - lifecycle_command
      - lifecycle_status_query
    env:
      RUST_LOG: info
      BIND_ADDRESS: "0.0.0.0"
      SOCKET_IO_PORT: "3030"
      MODE: "standalone"
      MONGODB_URI: "${MONGODB_URI:-mongodb://localhost:27017}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-gleanOak}"
      JWT_SECRET: "${JWT_SECRET:-}"
      SESSION_TTL_SECONDS: "3600"
      ALLOW_DEFAULT_CREDENTIALS: "${ALLOW_DEFAULT_CREDENTIALS:-false}"
      ALLOWED_ORIGINS: "http://localhost:1420,http://127.0.0.1:1420,http://localhost:25010,http://127.0.0.1:25010"
      SELECTED_ENTITY_ID: "rover-kiwi"
      FLEET_ROSTER: "rover-kiwi"
      RATE_LIMIT_AUTH_PER_MINUTE: "5"
      RATE_LIMIT_COMMANDS_PER_SECOND: "100"
      RATE_LIMIT_TTS_CONFIG_PER_SECOND: "4"
      MAX_TTS_TEXT_LENGTH: "1000"
      MAX_AUDIO_SAMPLES_PER_MESSAGE: "16000"
      MAX_WHEEL_VELOCITY: "2.0"
      TTS_DEFAULT_LANGUAGE: "${TTS_DEFAULT_LANGUAGE:-en}"
      TTS_DEFAULT_SPEAKER_ID: "${TTS_DEFAULT_SPEAKER_ID:-5}"
      TTS_DEFAULT_SPEED: "${TTS_DEFAULT_SPEED:-1.0}"
      TTS_DEFAULT_STEPS: "${TTS_DEFAULT_STEPS:-8}"
      TTS_DEFAULT_VOLUME: "${TTS_DEFAULT_VOLUME:-0.8}"
