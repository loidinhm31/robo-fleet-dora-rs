nodes:
  # Audio capture - microphone input
  - id: audio-capture
    build: cargo build --release -p audio_capture
    path: ../target/release/audio_capture
    inputs:
      tick:
        source: dora/timer/millis/50  # 20 Hz
        queue_size: 1
      audio_control:
        source: zenoh-bridge/audio_command
        queue_size: 8
      playback_state:
        source: audio-playback/playback_state
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - audio  # Float32 audio data
      - lifecycle_component_status
    env:
      SAMPLE_RATE: "16000"
      CHANNELS: "1"  # preserve downstream mono contract; multichannel mics are downmixed in audio_capture
      CHUNK_SIZE: "800"
      AUDIO_DEVICE: "${AUDIO_DEVICE:-sysdefault:CARD=Camera}"
      # Debug: dump exactly what this node sends downstream (post downmix/resample,
      # 16 kHz mono f32) to a playable WAV (VLC/Audacity/ffmpeg). Complements
      # scripts/check-usb-microphone.py (OS-level) by verifying the in-pipeline
      # capture path. Off by default; AUDIO_DUMP_MAX_SECS caps file size.
      #AUDIO_DUMP_FILE: "/tmp/rover-kiwi-audio-dump.wav"
      #AUDIO_DUMP_MAX_SECS: "30"

  # Convert capture F32 to S16LE before cross-machine transport.
  - id: audio-converter
    build: cargo build --release -p audio_converter
    path: ../target/release/audio_converter
    inputs:
      audio_input:
        source: audio-capture/audio
        queue_size: 4
    outputs:
      - audio_output
    env:
      RUST_LOG: info
      OUTPUT_FORMAT: "s16le"
      SAMPLE_RATE: "16000"
      CHANNELS: "1"

  # Edge voice - rover-side Supertonic synthesis.
  - id: edge-voice
    build: cargo build --release -p edge_voice
    path: ../target/release/edge_voice
    inputs:
      tts_command:
        source: zenoh-bridge/tts_command
        queue_size: 8
      tts_config_command:
        source: zenoh-bridge/tts_config_command
        queue_size: 8
      playback_state:
        source: audio-playback/walkie_state
        queue_size: 8
      playback_result:
        source: audio-playback/playback_result
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - tts_audio
      - tts_synthesis_state
      - voice_status
      - tts_command_result
      - metrics
      - lifecycle_component_status
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      EDGE_VOICE_MODEL_DIR: "${EDGE_VOICE_MODEL_DIR:-models/.cache/sherpa-onnx/tts/sherpa-onnx-supertonic-3-tts-int8-2026-05-11}"
      EDGE_VOICE_NUM_THREADS: "2"
      EDGE_VOICE_QUEUE_CAPACITY: "8"
      TTS_DEFAULT_LANGUAGE: "en"
      TTS_DEFAULT_SPEAKER_ID: "5"
      TTS_DEFAULT_SPEED: "1.0"
      TTS_DEFAULT_STEPS: "8"
      TTS_DEFAULT_VOLUME: "0.8"

  # Audio playback - sole speaker owner for walkie and rover TTS.
  - id: audio-playback
    build: cargo build --release -p audio_playback
    path: ../target/release/audio_playback
    inputs:
      tick:
        source: dora/timer/millis/20
        queue_size: 1
      walkie_audio:
        source: zenoh-bridge/audio_stream  # From Orchestra (Web UI mic)
        queue_size: 4
      tts_audio:
        source: edge-voice/tts_audio
        queue_size: 4
      tts_synthesis_state:
        source: edge-voice/tts_synthesis_state
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - playback_state  # Actual samples consumed; gates rover microphone publication
      - walkie_state    # 250 ms walkie authority window; cancels/rejects edge TTS
      - playback_audio   # Digital speaker monitor for browser clients
      - playback_result # Terminal only after final CPAL consumption or playback failure
      - lifecycle_component_status
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      PLAYBACK_VOLUME: "1.0"

  # Resource monitor stays active while workload nodes pause.
  - id: resource-monitor
    build: cargo build --release -p resource_monitor
    path: ../target/release/resource_monitor
    inputs:
      tick: dora/timer/millis/5000
    outputs:
      - resource_snapshot
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      RESOURCE_MONITOR_ROLE: "rover"
      RESOURCE_MONITOR_SCOPE: "${RESOURCE_MONITOR_SCOPE:-}"
      RESOURCE_MONITOR_NODES: '[{"node_id":"audio-capture","executable":"audio_capture","domain_id":"audio-capture"},{"node_id":"audio-converter","executable":"audio_converter"},{"node_id":"edge-voice","executable":"edge_voice","domain_id":"edge-voice"},{"node_id":"audio-playback","executable":"audio_playback","domain_id":"audio-playback"},{"node_id":"gst-camera","executable":"kornia_capture","domain_id":"gst-camera"},{"node_id":"video-encoder","executable":"video_encoder"},{"node_id":"visual-servo-controller","executable":"visual_servo_controller"},{"node_id":"arm-controller","executable":"arm_controller"},{"node_id":"rover-controller","executable":"rover_controller"},{"node_id":"zenoh-bridge","executable":"rover_zenoh_bridge"}]'

  # Transient local policy layer. Authority routing and external commands arrive in later phases.
  - id: power-coordinator
    build: cargo build --release -p power_coordinator
    path: ../target/release/power_coordinator
    inputs:
      resource_snapshot: resource-monitor/resource_snapshot
      lifecycle_status:
        source: lifecycle-manager/lifecycle_status
        queue_size: 64
      lifecycle_command_result: lifecycle-manager/lifecycle_command_result
      recording_occurrence_status:
        source: zenoh-bridge/recording_occurrence_status
        queue_size: 64
      protected_work_snapshot:
        source: zenoh-bridge/protected_work_snapshot
        queue_size: 16
      power_command:
        source: zenoh-bridge/power_command
        queue_size: 16
      power_event_ack: zenoh-bridge/power_event_ack
      power_snapshot_request: zenoh-bridge/power_snapshot_request
      tick: dora/timer/millis/1000
    outputs:
      - lifecycle_command
      - lifecycle_status_query
      - power_status
      - power_snapshot
      - power_event
      - power_transition
      - power_command_result
      - power_journal_record
      - power_journal_health
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"
      POWER_COORDINATOR_ROLE: "rover"
      POWER_JOURNAL_DIR: "${POWER_JOURNAL_DIR:-/var/lib/robo-fleet/power-journal/rover-kiwi}"
      POWER_JOURNAL_WAKE_RESERVE_RECORDS: "${POWER_JOURNAL_WAKE_RESERVE_RECORDS:-10}"

  - id: lifecycle-manager
    build: cargo build --release -p lifecycle_manager
    path: ../target/release/lifecycle_manager
    inputs:
      power_lifecycle_command: power-coordinator/lifecycle_command
      lifecycle_status_query_power: power-coordinator/lifecycle_status_query
      lifecycle_command_relay: zenoh-bridge/lifecycle_command_relay
      lifecycle_wake_lease_relay: zenoh-bridge/lifecycle_wake_lease_relay
      lifecycle_status_query: zenoh-bridge/lifecycle_status_query
      lifecycle_component_status_camera: gst-camera/lifecycle_component_status
      lifecycle_component_status_audio: audio-capture/lifecycle_component_status
      lifecycle_component_status_edge_voice: edge-voice/lifecycle_component_status
      lifecycle_component_status_audio_playback: audio-playback/lifecycle_component_status
      tick: dora/timer/millis/1000
    outputs:
      - lifecycle_command_result
      - lifecycle_status
      - lifecycle_capabilities
      - lifecycle_authorized_command
    env:
      RUST_LOG: info
      LIFECYCLE_CAPABILITIES: '[{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"gst-camera"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"audio-capture"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"edge-voice"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"audio-playback"},"supported":true,"always_on":false},{"target":{"role":"rover","entity_id":"${ENTITY_ID:-rover-kiwi}","node_id":"zenoh-bridge"},"supported":false,"always_on":true}]'

  # GStreamer camera capture + consolidated vision pipeline
  # Default: camera-only (zero ML overhead). Enable via TrackingCommand::Enable.
  - id: gst-camera
    build: cargo build -p kornia_capture --release
    path: ../target/release/kornia_capture
    inputs:
      tick: dora/timer/millis/33           # ~30 FPS
      camera_control: zenoh-bridge/camera_command
      stream_control: zenoh-bridge/stream_command  # Gates only operator view branch
      tracking_command: zenoh-bridge/tracking_command  # Gates detection/tracking pipeline
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
      autonomous_motion_safety_ack:
        source: rover-controller/autonomous_motion_safety_ack
        queue_size: 2
    outputs:
      - frame                  # 15 FPS raw RGB8 view branch for local JPEG encoding
      - detections             # DetectionFrame raw YOLO (detection-only mode)
      - tracked_detections     # DetectionFrame with tracking IDs (when full pipeline enabled)
      - tracking_telemetry     # TrackingTelemetry (when full pipeline enabled)
      - lifecycle_component_status
      - autonomous_motion_safety # Stop-and-hold request; camera waits for controller acknowledgement
    env:
      # Camera
      SOURCE_TYPE: "webcam"
      SOURCE_URI: "${ROVER_CAMERA_URI:-/dev/video0}"
      IMAGE_COLS: "640"
      IMAGE_ROWS: "480"
      SOURCE_FPS: "30"
      VIEW_STREAM_FPS: "15"
      # YOLO detector (lazy-loaded on first TrackingCommand::Enable)
      MODEL_PATH: "${ROVER_YOLO_MODEL_PATH:-models/.cache/yolo/yolo12n.onnx}"
      CONFIDENCE_THRESHOLD: "0.5"
      NMS_THRESHOLD: "0.4"
      TARGET_CLASSES: ""
      DETECTOR_INTRA_THREADS: "2"
      # Default assumes a system-wide ONNX Runtime 1.16.x install.
      # Override ROVER_ORT_DYLIB_PATH when using an extracted local runtime.
      ORT_DYLIB_PATH: "${ROVER_ORT_DYLIB_PATH:-/usr/local/lib/libonnxruntime.so}"
      # ReID extractor
      REID_MODEL_PATH: "${ROVER_REID_MODEL_PATH:-models/.cache/reid/osnet_x0_25.onnx}"
      MIN_BBOX_SIZE: "32"
      REID_INTRA_THREADS: "1"
      # BoTSORT tracker
      MAX_TRACKING_AGE: "50"
      MIN_HITS: "3"
      IOU_THRESHOLD: "0.3"
      REID_WEIGHT: "0.8"
      REID_THRESHOLD: "0.5"
      ENABLE_CMC: "true"

  # Rover-side JPEG compression for cross-machine viewing.
  # Local ML continues to use raw camera frames inside gst-camera at capture cadence.
  - id: video-encoder
    build: cargo build --release -p video_encoder
    path: ../target/release/video_encoder
    inputs:
      video_frame: gst-camera/frame
    outputs:
      - encoded_frame
    env:
      RUST_LOG: info
      JPEG_QUALITY: "80"
      IMAGE_WIDTH: "640"
      IMAGE_HEIGHT: "480"

  - id: visual-servo-controller
    build: cargo build --release -p visual_servo_controller
    path: ../target/release/visual_servo_controller
    inputs:
      tracking_telemetry: gst-camera/tracking_telemetry
    outputs:
      - servo_command
      - servo_telemetry
    env:
      RUST_LOG: info
      LATERAL_PID_KP: "1.5"
      LATERAL_PID_KI: "0.0"
      LATERAL_PID_KD: "0.2"
      LONGITUDINAL_PID_KP: "0.8"
      LONGITUDINAL_PID_KI: "0.0"
      LONGITUDINAL_PID_KD: "0.15"
      MIN_DISTANCE: "1.0"
      MAX_VELOCITY: "0.5"
      MAX_ANGULAR_VELOCITY: "1.0"
      TARGET_BBOX_HEIGHT: "0.3"
      DEAD_ZONE: "0.05"

  # Arm controller
  - id: arm-controller
    build: cargo build --release -p arm_controller
    path: ../target/release/arm_controller
    inputs:
      arm_command: zenoh-bridge/arm_command  # From Orchestra via Zenoh
      # arm_telemetry: sim-interface/arm_telemetry
    outputs:
      - processed_arm_command
    env:
      RUST_LOG: info
      ARM_CONFIG: config/arm_6dof.toml

  # Rover controller
  - id: rover-controller
    build: cargo build --release -p rover_controller
    path: ../target/release/rover_controller
    inputs:
      rover_command: zenoh-bridge/rover_command  # From Orchestra via Zenoh
      servo_command: visual-servo-controller/servo_command
      autonomous_motion_safety:
        source: gst-camera/autonomous_motion_safety
        queue_size: 2
      # rover_telemetry: sim-interface/rover_telemetry
    outputs:
      - processed_rover_command
      - autonomous_motion_safety_ack # Controller acceptance/forwarding acknowledgement, not motor feedback
    env:
      RUST_LOG: info

#  # Simulation interface
#  - id: sim-interface
#    build: cargo build --release -p sim_interface
#    path: target/release/sim_interface
#    inputs:
#      arm_command: arm-controller/processed_arm_command
#      rover_command: rover-controller/processed_rover_command
#    outputs:
#      - rover_telemetry
#      - arm_telemetry
#    env:
#      RUST_LOG: info

  # Zenoh bridge - On-rover bridge
  - id: zenoh-bridge
    build: cargo build --release -p rover_zenoh_bridge
    path: ../target/release/rover_zenoh_bridge
    inputs:
      video_frame: video-encoder/encoded_frame
      audio_frame:
        source: audio-converter/audio_output
        queue_size: 4
      playback_audio:
        source: audio-playback/playback_audio
        queue_size: 4
      # rover_telemetry: sim-interface/rover_telemetry
      # arm_telemetry: sim-interface/arm_telemetry
      servo_telemetry: visual-servo-controller/servo_telemetry
      resource_snapshot: resource-monitor/resource_snapshot
      lifecycle_command_result: lifecycle-manager/lifecycle_command_result
      # Preserve the complete lifecycle snapshot for Orchestra forwarding.
      lifecycle_status:
        source: lifecycle-manager/lifecycle_status
        queue_size: 64
      lifecycle_capabilities: lifecycle-manager/lifecycle_capabilities
      voice_status:
        source: edge-voice/voice_status
        queue_size: 8
      tts_command_result:
        source: edge-voice/tts_command_result
        queue_size: 8
      detections: gst-camera/detections                   # DetectionFrame (detection-only mode)
      tracked_detections: gst-camera/tracked_detections   # DetectionFrame with tracking IDs
      tracking_telemetry: gst-camera/tracking_telemetry   # TrackingTelemetry
      power_status: power-coordinator/power_status
      power_command_result: power-coordinator/power_command_result
      power_snapshot: power-coordinator/power_snapshot
      power_journal_record:
        source: power-coordinator/power_journal_record
        queue_size: 32
    outputs:
      - camera_command
      - audio_command
      - rover_command
      - arm_command
      - stream_command     # Routed to gst-camera (gates view output only)
      - tracking_command    # Routed to gst-camera (gates vision pipeline)
      - tts_command
      - tts_config_command
      - audio_stream
      - lifecycle_command_relay
      - lifecycle_wake_lease_relay
      - lifecycle_status_query
      - recording_occurrence_status
      - protected_work_snapshot
      - power_command
      - power_command_result
      - power_event_ack
      - power_snapshot_request
    env:
      RUST_LOG: info
      ZENOH_MODE: "peer"
      ENTITY_ID: "rover-kiwi"
      ZENOH_CONFIG: "${ROVER_ZENOH_CONFIG:-zenoh_bridge/zenoh_config.json5}"
      POWER_PROTECTED_WORK_HMAC_KEY: "${POWER_PROTECTED_WORK_HMAC_KEY:-}"
      POWER_COMMAND_HMAC_KEY: "${POWER_COMMAND_HMAC_KEY:-}"
      POWER_DEPLOYMENT_ID: "${POWER_DEPLOYMENT_ID:-default}"
