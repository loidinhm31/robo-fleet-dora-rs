nodes:
  # Audio capture - microphone input
  - id: audio-capture
    build: cargo build --release -p audio_capture
    path: ../target/release/audio_capture
    inputs:
      tick: dora/timer/millis/50  # 20 Hz
      audio_control: zenoh-bridge/audio_command
    outputs:
      - audio  # Float32 audio data
    env:
      SAMPLE_RATE: "16000"
      CHANNELS: "1"
      CHUNK_SIZE: "800"
      # AUDIO_DEVICE: "USB Audio"  # substring match; set when ALSA 'default' maps to wrong card

  # TTS - Sherpa-ONNX lightweight neural TTS for edge device
  # - id: sherpa-tts
  #   build: cargo build --release -p sherpa_tts
  #   path: ../target/release/sherpa_tts
  #   inputs:
  #     tts_command: zenoh-bridge/tts_command  # From Orchestra
  #   env:
  #     RUST_LOG: info
  #     TTS_MODEL_DIR: "${HOME}/.cache/sherpa-onnx/vits-piper-en_US-lessac-medium"
  #     TTS_VOLUME: "0.8"
  #     TTS_SPEED: "1.0"
  #     TTS_NUM_THREADS: "2"
  #     TTS_PROVIDER: "cpu"
  #     LD_LIBRARY_PATH: "${HOME}/ws/sharing/robo-fleet-dora-rs/target/release"

  # Audio playback - Speaker output (walkie-talkie)
  - id: audio-playback
    build: cargo build --release -p audio_playback
    path: ../target/release/audio_playback
    inputs:
      audio: zenoh-bridge/audio_stream  # From Orchestra (Web UI mic)
    env:
      RUST_LOG: info
      SAMPLE_RATE: "16000"
      CHANNELS: "1"

  # Performance monitor - Local system metrics
  - id: performance-monitor
    build: cargo build --release -p performance_monitor
    path: ../target/release/performance_monitor
    inputs:
      tick: dora/timer/millis/5000
    outputs:
      - metrics  # SystemMetrics
    env:
      RUST_LOG: info
      ENTITY_ID: "rover-kiwi"  # Rover identity for fleet tracking

  # GStreamer camera capture + consolidated vision pipeline
  # Default: camera-only (zero ML overhead). Enable via TrackingCommand::Enable.
  - id: gst-camera
    build: cargo build -p kornia_capture --release
    path: ../target/release/kornia_capture
    inputs:
      tick: dora/timer/millis/33           # ~30 FPS
      camera_control: zenoh-bridge/camera_command
      stream_control: zenoh-bridge/stream_command  # Gates only operator view branch
      tracking_command: zenoh-bridge/tracking_command  # Gates detection/tracking pipeline
    outputs:
      - frame                  # 15 FPS raw RGB8 view branch for local JPEG encoding
      - detections             # DetectionFrame raw YOLO (detection-only mode)
      - tracked_detections     # DetectionFrame with tracking IDs (when full pipeline enabled)
      - tracking_telemetry     # TrackingTelemetry (when full pipeline enabled)
    env:
      # Camera
      SOURCE_TYPE: "webcam"
      SOURCE_URI: "${ROVER_CAMERA_URI:-/dev/video0}"
      IMAGE_COLS: "640"
      IMAGE_ROWS: "480"
      SOURCE_FPS: "30"
      VIEW_STREAM_FPS: "15"
      # YOLO detector (lazy-loaded on first TrackingCommand::Enable)
      MODEL_PATH: "${ROVER_YOLO_MODEL_PATH:-models/.cache/yolo/yolo12n.onnx}"
      CONFIDENCE_THRESHOLD: "0.5"
      NMS_THRESHOLD: "0.4"
      TARGET_CLASSES: ""
      ORT_DYLIB_PATH: "${ROVER_ORT_DYLIB_PATH:-/usr/local/lib/libonnxruntime.so}"
      # ReID extractor
      REID_MODEL_PATH: "${ROVER_REID_MODEL_PATH:-models/.cache/reid/osnet_x0_25.onnx}"
      MIN_BBOX_SIZE: "32"
      # BoTSORT tracker
      MAX_TRACKING_AGE: "50"
      MIN_HITS: "3"
      IOU_THRESHOLD: "0.3"
      REID_WEIGHT: "0.8"
      REID_THRESHOLD: "0.5"
      ENABLE_CMC: "true"

  # Rover-side JPEG compression for cross-machine viewing.
  # Local ML continues to use raw camera frames inside gst-camera at capture cadence.
  - id: video-encoder
    build: cargo build --release -p video_encoder
    path: ../target/release/video_encoder
    inputs:
      video_frame: gst-camera/frame
    outputs:
      - encoded_frame
    env:
      RUST_LOG: info
      JPEG_QUALITY: "80"
      IMAGE_WIDTH: "640"
      IMAGE_HEIGHT: "480"

  - id: visual-servo-controller
    build: cargo build --release -p visual_servo_controller
    path: ../target/release/visual_servo_controller
    inputs:
      tracking_telemetry: gst-camera/tracking_telemetry
    outputs:
      - servo_command
      - servo_telemetry
    env:
      RUST_LOG: info
      LATERAL_PID_KP: "1.5"
      LATERAL_PID_KI: "0.0"
      LATERAL_PID_KD: "0.2"
      LONGITUDINAL_PID_KP: "0.8"
      LONGITUDINAL_PID_KI: "0.0"
      LONGITUDINAL_PID_KD: "0.15"
      MIN_DISTANCE: "1.0"
      MAX_VELOCITY: "0.5"
      MAX_ANGULAR_VELOCITY: "1.0"
      TARGET_BBOX_HEIGHT: "0.3"
      DEAD_ZONE: "0.05"

  # Arm controller
  - id: arm-controller
    build: cargo build --release -p arm_controller
    path: ../target/release/arm_controller
    inputs:
      arm_command: zenoh-bridge/arm_command  # From Orchestra via Zenoh
      # arm_telemetry: sim-interface/arm_telemetry
    outputs:
      - processed_arm_command
    env:
      RUST_LOG: info
      ARM_CONFIG: config/arm_6dof.toml

  # Rover controller
  - id: rover-controller
    build: cargo build --release -p rover_controller
    path: ../target/release/rover_controller
    inputs:
      rover_command: zenoh-bridge/rover_command  # From Orchestra via Zenoh
      servo_command: visual-servo-controller/servo_command
      # rover_telemetry: sim-interface/rover_telemetry
    outputs:
      - processed_rover_command
    env:
      RUST_LOG: info

#  # Simulation interface
#  - id: sim-interface
#    build: cargo build --release -p sim_interface
#    path: target/release/sim_interface
#    inputs:
#      arm_command: arm-controller/processed_arm_command
#      rover_command: rover-controller/processed_rover_command
#    outputs:
#      - rover_telemetry
#      - arm_telemetry
#    env:
#      RUST_LOG: info

  # Zenoh bridge - On-rover bridge
  - id: zenoh-bridge
    build: cargo build --release -p rover_zenoh_bridge
    path: ../target/release/rover_zenoh_bridge
    inputs:
      video_frame: video-encoder/encoded_frame
      audio_frame: audio-capture/audio
      # rover_telemetry: sim-interface/rover_telemetry
      # arm_telemetry: sim-interface/arm_telemetry
      servo_telemetry: visual-servo-controller/servo_telemetry
      performance_metrics: performance-monitor/metrics
      detections: gst-camera/detections                   # DetectionFrame (detection-only mode)
      tracked_detections: gst-camera/tracked_detections   # DetectionFrame with tracking IDs
      tracking_telemetry: gst-camera/tracking_telemetry   # TrackingTelemetry
    outputs:
      - camera_command
      - audio_command
      - rover_command
      - arm_command
      - stream_command     # Routed to gst-camera (gates view output only)
      - tracking_command    # Routed to gst-camera (gates vision pipeline)
      - tts_command
      - audio_stream
    env:
      RUST_LOG: info
      ZENOH_MODE: "peer"
      ENTITY_ID: "rover-kiwi"
      ZENOH_CONFIG: "${ROVER_ZENOH_CONFIG:-zenoh_bridge/zenoh_config.json5}"
