[package]
name = "central_speech_recognizer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace dependencies
dora-node-api = { workspace = true }
eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Official Sherpa runtime. Static linkage keeps the Orchestra binary portable.
sherpa-onnx = { version = "=1.13.3", default-features = false, features = ["static"] }

robo_rover_lib = { path = "../../robo_rover_lib" }
