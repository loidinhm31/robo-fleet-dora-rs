nodes:
  # ============================================================================
  # PyBullet Simulation - Local virtual rover for testing without real hardware
  # ============================================================================
#  - id: pybullet-sim
#    build: pip install -e pybullet_sim
#    path: pybullet_sim/pybullet_sim/main.py
#    inputs:
#      # Commands from web UI
#      rover_command: web-bridge/rover_command
#      arm_command: web-bridge/arm_command
#    outputs:
#      # Telemetry to web UI
#      - rover_telemetry
#      - arm_telemetry
#    env:
#      # Required
#      URDF_PATH: "../model/LeKiwi.urdf"
#
#      # Robot parameters (ST3215/STS3215 servo specs)
#      WHEEL_RADIUS: "0.05"          # 50mm wheels
#      CHASSIS_RADIUS: "0.15"        # 150mm from center to wheel
#      MAX_WHEEL_TORQUE: "2.94"      # 30 kg·cm = 2.94 N·m
#      MAX_WHEEL_VELOCITY: "6.47"    # ~62 RPM
#      CHASSIS_MASS: "2.0"           # 2kg robot
#
#      # Display
#      GUI_ENABLED: "true"            # Set to "false" for headless mode
#
#      # Physics simulation
#      PHYSICS_TIME_STEP: "0.004166"  # 240 Hz
#      GRAVITY: "-9.81"               # m/s²
#      FRICTION_COEFFICIENT: "0.7"    # Surface friction
#      LATERAL_FRICTION: "0.9"        # Mecanum wheel side friction
#      REAL_TIME: "false"             # Set to "true" for real-time simulation
#
#      # Logging
#      RUST_LOG: "info"

  # ============================================================================
  # Orchestra Zenoh Bridge - Connects orchestra dataflow to Zenoh network
  # Subscribes to selected rover's telemetry, publishes commands back
  - id: orchestra-bridge
    build: cargo build --release -p orchestra_zenoh_bridge
    path: ../target/release/orchestra_zenoh_bridge
    inputs:
      # Parser commands (carry authoritative target_entity_id — validated before Zenoh publication)
      tracking_command_parser: command-parser/tracking_command
      rover_command_parser: command-parser/rover_command
      camera_control_parser: command-parser/camera_control
      # Web/manual commands (routed to currently selected rover)
      tts_command_web:
        source: web-bridge/tts_command
        queue_size: 8
      tts_config_command:
        source: web-bridge/tts_config_command
        queue_size: 8
      rover_command_web: web-bridge/rover_command
      arm_command_web: web-bridge/arm_command
      tracking_command_web: web-bridge/tracking_command
      camera_command_web: web-bridge/camera_command
      audio_command_web:
        source: web-bridge/audio_command
        queue_size: 8
      stream_command_web: web-bridge/stream_command
      # Target-aware aggregate demand from browser viewers and future recorder sessions.
      targeted_media_control: web-bridge/targeted_media_control
      audio_stream_web:
        source: web-bridge/audio_stream
        queue_size: 4
      fleet_subscription_command: web-bridge/fleet_subscription_command
      fleet_select_command: web-bridge/fleet_select_command
      lifecycle_command_authorized: lifecycle-manager/lifecycle_authorized_command
      lifecycle_status_query: web-bridge/lifecycle_status_query
      recording_occurrence_status:
        source: recording-scheduler/recording_occurrence_status
        queue_size: 64
      protected_work_snapshot:
        source: recording-scheduler/protected_work_snapshot
        queue_size: 16
    outputs:
      # Data FROM active rovers via Zenoh (subscribers)
      - video_frame         # JPEG frames from rover camera (with entity_id in metadata)
      - audio_frame         # Int16LE audio from rover microphone (with origin metadata)
      - playback_audio_frame # Int16LE rover speaker monitor for browser clients only
      - rover_telemetry     # Rover position/velocity telemetry (with entity_id)
      - arm_telemetry       # Arm joint positions (with entity_id)
      - servo_telemetry     # Visual servoing telemetry (with entity_id)
      - detections          # DetectionFrame raw YOLO (detection-only mode, with entity_id)
      - tracked_detections  # DetectionFrame with tracking IDs from rover (with entity_id)
      - tracking_telemetry  # Object tracking telemetry from rover (with entity_id)
      - resource_snapshot # Resource snapshot from rover (with entity_id)
      - voice_status        # Per-rover voice lifecycle state
      - tts_command_result  # Terminal TTS lifecycle result
      - lifecycle_command_result
      - lifecycle_status
      - lifecycle_capabilities
      - protected_work_snapshot_request
    env:
      RUST_LOG: info
      ZENOH_MODE: "peer"
      ENTITY_ID: "orchestra"                    # This node's ID
      ACTIVE_ROVERS: "rover-kiwi"               # Comma-separated list; lifecycle status queues support up to 15 active Rovers
      ZENOH_CONFIG: "${ORCHESTRA_ZENOH_CONFIG:-zenoh_bridge/zenoh_config.json5}"
      VIDEO_WIDTH: "640"
      VIDEO_HEIGHT: "480"
      AUDIO_SAMPLE_RATE: "16000"
      AUDIO_CHANNELS: "1"
      POWER_PROTECTED_WORK_HMAC_KEYS: "${POWER_PROTECTED_WORK_HMAC_KEYS:-}"

  # Central final-only VAD/offline speech recognizer.
  - id: central-speech-recognizer
    build: cargo build --release -p central_speech_recognizer
    path: ../target/release/central_speech_recognizer
    inputs:
      audio_rover:
        source: orchestra-bridge/audio_frame  # S16LE rover microphone audio
        queue_size: 4
      # Web bridge assigns target identity and validates browser stream ownership.
      audio_browser:
        source: web-bridge/voice_command_audio
        queue_size: 4
      browser_control:
        source: web-bridge/voice_command_control
        queue_size: 8
      stt_status_request:
        source: web-bridge/stt_status_request
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - transcription  # SpeechTranscription
      - stt_status     # SttStatus loading/ready/error lifecycle
      - lifecycle_component_status
    env:
      RUST_LOG: info
      STT_PROFILE: "${STT_PROFILE:-en-vad-offline}"
      STT_MODEL_ROOT: "${STT_MODEL_ROOT:-../models/.cache/sherpa-onnx/asr}"
      STT_NUM_THREADS: "${STT_NUM_THREADS:-2}"
      STT_VAD_THRESHOLD: "${STT_VAD_THRESHOLD:-0.5}"
      STT_VAD_MIN_SILENCE_SECONDS: "${STT_VAD_MIN_SILENCE_SECONDS:-0.25}"
      STT_VAD_MIN_SPEECH_SECONDS: "${STT_VAD_MIN_SPEECH_SECONDS:-0.25}"
      STT_VAD_MAX_SPEECH_SECONDS: "${STT_VAD_MAX_SPEECH_SECONDS:-8.0}"
      STT_DECODE_QUEUE_CAPACITY: "${STT_DECODE_QUEUE_CAPACITY:-8}"

  # Command parser - NLU with pattern matching
  # Phase 02: carries authoritative target_entity_id in every actuator output.
  # Automatic parser TTS removed; manual UI TTS is routed to rover edge_voice.
  - id: command-parser
    build: cargo build --release -p command_parser
    path: ../target/release/command_parser
    inputs:
      text: central-speech-recognizer/transcription
    outputs:
      - rover_command     # RoverCommandWithMetadata (carries target_entity_id for source-aware routing)
      - tracking_command  # TrackingCommand for object tracking
      - camera_control    # CameraControl for camera on/off
      - feedback          # String feedback for web UI
    env:
      RUST_LOG: info
      CONFIDENCE_THRESHOLD: "0.7"

  # Orchestra-side recorder. Media inputs are direct fan-out from the bridge so
  # recorder backpressure cannot block browser delivery or speech processing.
  # The scheduler has no recorder or direct rover-control output. It owns durable
  # intent and reports occurrence state; the Orchestra bridge relays that state
  # to the target rover's protected-work gate. Web-bridge remains the sole
  # recorder-session and media-demand authority.
  - id: recording-scheduler
    build: cargo build --release -p recording_scheduler
    path: ../target/release/recording_scheduler
    inputs:
      # CRUD/query admission is bounded by web-bridge (64 by default); queued
      # requests expire there, then clients receive a bounded unavailable result.
      recording_schedule_command:
        source: web-bridge/recording_schedule_command
        queue_size: 32
      recording_schedule_query:
        source: web-bridge/recording_schedule_query
        queue_size: 32
      # Durable recorder feedback is spooled by web-bridge; queue overflow is
      # repaired by the scheduler's reconciliation snapshot.
      recording_scheduler_recorder_feedback:
        source: web-bridge/recording_scheduler_recorder_feedback
        queue_size: 64
      recording_reconciliation_snapshot:
        source: web-bridge/recording_reconciliation_snapshot
        # Snapshots are idempotent; the scheduler requests another one every
        # reconciliation interval, repairing a full bounded transport queue.
        queue_size: 8
      protected_work_snapshot_request:
        source: orchestra-bridge/protected_work_snapshot_request
        queue_size: 16
    outputs:
      - recording_schedule_command_result
      - recording_schedule_snapshot
      - recording_occurrence_status
      - protected_work_snapshot
      - scheduled_recording_intent
      - recording_reconciliation_request
      - recording_scheduler_manual_suppression_ack
      - recording_scheduler_status
    env:
      RUST_LOG: info
      MONGODB_URI: "${MONGODB_URI:-mongodb://localhost:27017}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-db}"
      RECORDING_SCHEDULER_HORIZON_DAYS: "${RECORDING_SCHEDULER_HORIZON_DAYS:-35}"
      RECORDING_SCHEDULER_MAX_FUTURE_DAYS: "${RECORDING_SCHEDULER_MAX_FUTURE_DAYS:-365}"
      RECORDING_SCHEDULER_MAX_SCHEDULES_PER_ENTITY: "${RECORDING_SCHEDULER_MAX_SCHEDULES_PER_ENTITY:-100}"
      RECORDING_SCHEDULER_RECONCILE_SECONDS: "${RECORDING_SCHEDULER_RECONCILE_SECONDS:-30}"
      RECORDING_SCHEDULER_READY_LEASE_SECONDS: "${RECORDING_SCHEDULER_READY_LEASE_SECONDS:-90}"
      # Retry cadence (1/2/4/8/16/30 seconds) and terminal 90-day TTL are
      # protocol constants, not environment-tunable safety controls.

  - id: media-recorder
    build: cargo build --release -p media_recorder
    path: ../target/release/media_recorder
    inputs:
      video_frame:
        source: orchestra-bridge/video_frame
        queue_size: 8
      audio_frame:
        source: orchestra-bridge/audio_frame
        queue_size: 8
      recording_session_command:
        source: web-bridge/recording_session_command
        queue_size: 8
      recording_clip_query:
        source: web-bridge/recording_clip_query
        queue_size: 8
      recording_playback_ticket:
        source: web-bridge/recording_playback_ticket
        queue_size: 8
      recording_delete:
        source: web-bridge/recording_delete
        queue_size: 8
      recording_reconciliation_request:
        source: web-bridge/recording_reconciliation_request
        queue_size: 8
      lifecycle_command:
        source: lifecycle-manager/lifecycle_authorized_command
        queue_size: 2
    outputs:
      - recording_session_command_result
      - recording_session_status
      - recording_clip_list_result
      - recording_playback_clip_result
      - recording_delete_result
      - recording_reconciliation_snapshot
      - lifecycle_component_status
    env:
      RUST_LOG: info
      RECORDING_ROOT: "${RECORDING_ROOT:-/home/robo-fleet-recordings}"
      RECORDING_CONTROL_QUEUE_CAPACITY: "${RECORDING_CONTROL_QUEUE_CAPACITY:-64}"

  # Local Orchestra resources use the same versioned contract as rover resources.
  - id: resource-monitor
    build: cargo build --release -p resource_monitor
    path: ../target/release/resource_monitor
    inputs:
      tick: dora/timer/millis/5000
    outputs:
      - resource_snapshot
    env:
      RUST_LOG: info
      ENTITY_ID: "orchestra"
      RESOURCE_MONITOR_ROLE: "orchestra"
      RESOURCE_MONITOR_SCOPE: "${RESOURCE_MONITOR_SCOPE:-}"
      RESOURCE_MONITOR_NODES: '[{"node_id":"orchestra-bridge","executable":"orchestra_zenoh_bridge"},{"node_id":"central-speech-recognizer","executable":"central_speech_recognizer","domain_id":"central-speech-recognizer"},{"node_id":"command-parser","executable":"command_parser"},{"node_id":"recording-scheduler","executable":"recording_scheduler"},{"node_id":"media-recorder","executable":"media_recorder"},{"node_id":"web-bridge","executable":"web_bridge"}]'

  - id: power-coordinator
    build: cargo build --release -p power_coordinator
    path: ../target/release/power_coordinator
    inputs:
      resource_snapshot: resource-monitor/resource_snapshot
      lifecycle_status:
        source: lifecycle-manager/lifecycle_status
        queue_size: 64
      lifecycle_command_result: lifecycle-manager/lifecycle_command_result
      recording_occurrence_status:
        source: recording-scheduler/recording_occurrence_status
        queue_size: 64
      protected_work_snapshot:
        source: recording-scheduler/protected_work_snapshot
        queue_size: 16
      power_event_ack: power-event-projector/power_event_ack
      tick: dora/timer/millis/1000
    outputs:
      - lifecycle_command
      - lifecycle_status_query
      - power_status
      - power_transition
      - power_command_result
      - power_journal_record
      - power_journal_health
    env:
      RUST_LOG: info
      ENTITY_ID: "orchestra"
      POWER_COORDINATOR_ROLE: "orchestra"
      POWER_JOURNAL_DIR: "${POWER_JOURNAL_DIR:-/var/lib/robo-fleet/power-journal/orchestra}"
      POWER_JOURNAL_WAKE_RESERVE_RECORDS: "${POWER_JOURNAL_WAKE_RESERVE_RECORDS:-10}"

  - id: power-event-projector
    build: cargo build --release -p power_event_projector
    path: ../target/release/power_event_projector
    inputs:
      power_journal_record: power-coordinator/power_journal_record
    outputs:
      - power_event_ack
      - power_projector_health
    env:
      RUST_LOG: info
      POWER_DEPLOYMENT_ID: "${POWER_DEPLOYMENT_ID:-default}"
      MONGODB_URI: "${MONGODB_URI:-mongodb://127.0.0.1:27017}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-gleanOak}"
      POWER_PROJECTOR_RETRY_ATTEMPTS: "${POWER_PROJECTOR_RETRY_ATTEMPTS:-3}"
      POWER_PROJECTOR_RETRY_BACKOFF_MS: "${POWER_PROJECTOR_RETRY_BACKOFF_MS:-100}"

  - id: lifecycle-manager
    build: cargo build --release -p lifecycle_manager
    path: ../target/release/lifecycle_manager
    inputs:
      power_lifecycle_command: power-coordinator/lifecycle_command
      lifecycle_status_query_power: power-coordinator/lifecycle_status_query
      lifecycle_command: web-bridge/lifecycle_command
      # The bridge relays every safe Rover node status in one manager tick.
      # Retain the full remote snapshot before the manager merges it locally.
      # 15 Rovers × four safe nodes plus four local Orchestra statuses fill this queue.
      lifecycle_component_status:
        source: orchestra-bridge/lifecycle_status
        queue_size: 64
      lifecycle_component_status_recorder: media-recorder/lifecycle_component_status
      lifecycle_component_status_stt: central-speech-recognizer/lifecycle_component_status
      lifecycle_status_query: web-bridge/lifecycle_status_query
      tick: dora/timer/millis/1000
    outputs:
      - lifecycle_command_result
      - lifecycle_status
      - lifecycle_capabilities
      - protected_work_snapshot_request
      - lifecycle_authorized_command
    env:
      RUST_LOG: info
      LIFECYCLE_CAPABILITIES: '[{"target":{"role":"orchestra","entity_id":"orchestra","node_id":"central-speech-recognizer"},"supported":true,"always_on":false},{"target":{"role":"orchestra","entity_id":"orchestra","node_id":"media-recorder"},"supported":false,"always_on":true},{"target":{"role":"orchestra","entity_id":"orchestra","node_id":"orchestra-bridge"},"supported":false,"always_on":true},{"target":{"role":"orchestra","entity_id":"orchestra","node_id":"web-bridge"},"supported":false,"always_on":true}]'
      LIFECYCLE_REMOTE_ROVER_ENTITIES: "${ACTIVE_ROVERS:-rover-kiwi}"

  # Web bridge - Fleet control with entity selection
  - id: web-bridge
    build: cargo build --release -p web_bridge
    path: ../target/release/web_bridge
    inputs:
      # Media streams (encoded data for web clients)
      video_frame:
        source: orchestra-bridge/video_frame    # JPEG from rover-side encoder
        queue_size: 8
      audio_frame:
        source: orchestra-bridge/audio_frame    # Int16LE PCM from rover
        queue_size: 4
      playback_audio_frame:
        source: orchestra-bridge/playback_audio_frame # Int16LE PCM from rover speakers, not STT
        queue_size: 4

      # ========================================================================
      # Telemetry from LOCAL SIMULATION (for testing without real hardware)
      # ========================================================================
#      rover_telemetry: pybullet-sim/rover_telemetry
#      arm_telemetry: pybullet-sim/arm_telemetry

      # ========================================================================
      # Telemetry from REMOTE ROVERS (via orchestra-bridge)
      # ========================================================================
      rover_telemetry: orchestra-bridge/rover_telemetry
      arm_telemetry: orchestra-bridge/arm_telemetry
      servo_telemetry: orchestra-bridge/servo_telemetry
      rover_resource_snapshot: orchestra-bridge/resource_snapshot
      orchestra_resource_snapshot: resource-monitor/resource_snapshot
      lifecycle_command_result: lifecycle-manager/lifecycle_command_result
      # One manager tick emits every local and active-Rover status. Keep the
      # complete authoritative snapshot instead of retaining only its tail.
      lifecycle_status:
        source: lifecycle-manager/lifecycle_status
        queue_size: 64
      lifecycle_capabilities: lifecycle-manager/lifecycle_capabilities
      # Browser lifecycle state is emitted by Orchestra's lifecycle manager,
      # which owns the command epoch for relayed Rover operations.

      # Processed data (from rovers via orchestra-bridge)
      detections: orchestra-bridge/detections
      tracked_detections: orchestra-bridge/tracked_detections
      tracking_telemetry: orchestra-bridge/tracking_telemetry
      voice_status:
        source: orchestra-bridge/voice_status
        queue_size: 8
      tts_command_result:
        source: orchestra-bridge/tts_command_result
        queue_size: 8
      recording_session_command_result:
        source: media-recorder/recording_session_command_result
        queue_size: 8
      recording_session_status:
        source: media-recorder/recording_session_status
        queue_size: 8
      recording_clip_list_result:
        source: media-recorder/recording_clip_list_result
        queue_size: 8
      recording_playback_clip_result:
        source: media-recorder/recording_playback_clip_result
        queue_size: 8
      recording_delete_result:
        source: media-recorder/recording_delete_result
        queue_size: 8
      recording_schedule_command_result:
        source: recording-scheduler/recording_schedule_command_result
        queue_size: 32
      recording_schedule_snapshot:
        source: recording-scheduler/recording_schedule_snapshot
        queue_size: 32
      recording_occurrence_status:
        source: recording-scheduler/recording_occurrence_status
        queue_size: 64
      scheduled_recording_intent:
        source: recording-scheduler/scheduled_recording_intent
        queue_size: 64
      recording_reconciliation_request:
        source: recording-scheduler/recording_reconciliation_request
        queue_size: 8
      recording_scheduler_manual_suppression_ack:
        source: recording-scheduler/recording_scheduler_manual_suppression_ack
        queue_size: 16
      recording_scheduler_status:
        source: recording-scheduler/recording_scheduler_status
        queue_size: 8
      recording_reconciliation_snapshot:
        source: media-recorder/recording_reconciliation_snapshot
        queue_size: 8
      transcription:
        source: central-speech-recognizer/transcription
        queue_size: 8
      stt_status:
        source: central-speech-recognizer/stt_status
        queue_size: 8
      command_feedback: command-parser/feedback
    outputs:
      # Commands to selected rover (via orchestra-bridge)
      - rover_command
      - arm_command
      - tracking_command
      - camera_command
      - audio_command
      - stream_command
      - targeted_media_control
      - tts_command
      - tts_config_command
      - audio_stream          # Direct audio to rover speakers
      - voice_command_audio   # Audio for STT processing
      - voice_command_control # Browser STT start/stop lifecycle
      - stt_status_request    # Request current central STT lifecycle status
      - fleet_subscription_command  # Fleet subscription management (activate/deactivate rovers)
      - fleet_select_command        # Fleet selection (which rover receives commands)
      - recording_session_command
      - recording_clip_query
      - recording_playback_ticket
      - recording_delete
      - recording_schedule_command
      - recording_schedule_query
      - recording_scheduler_recorder_feedback
      - recording_reconciliation_request
      - recording_reconciliation_snapshot
      - lifecycle_command
      - lifecycle_status_query
    env:
      RUST_LOG: info

      # Mode
      MODE: "orchestra"                  # Orchestra mode (no local Dora nodes)
      ZENOH_ENABLED: "false"             # Don't use Zenoh in web_bridge (orchestra-bridge handles it)

      # Network Configuration
      BIND_ADDRESS: "0.0.0.0"
      SOCKET_IO_PORT: "3030"

      # Authentication (credentials stored in MongoDB — see MONGODB_URI)
      MONGODB_URI: "${MONGODB_URI:-mongodb://localhost:27017}"
      MONGODB_DATABASE: "${MONGODB_DATABASE:-db}"
      JWT_SECRET: "${JWT_SECRET:-}"
      SESSION_TTL_SECONDS: "3600"
      # Local validation default. Override to false in stricter environments.
      ALLOW_DEFAULT_CREDENTIALS: "${ALLOW_DEFAULT_CREDENTIALS:-true}"

      # CORS
      ALLOWED_ORIGINS: "http://localhost:1420,http://localhost:3000,http://localhost:3001"

      # Rate Limiting
      RATE_LIMIT_AUTH_PER_MINUTE: "5"
      RATE_LIMIT_COMMANDS_PER_SECOND: "100"
      RATE_LIMIT_TTS_CONFIG_PER_SECOND: "4"
      WEB_STT_QUEUE_CAPACITY: "64"          # 8x central decode queue; newest audio drops
      WEB_STT_STREAM_IDLE_SECONDS: "30"
      WEB_STT_CLOSING_SECONDS: "30"
      # Disabled rejects schedule API requests without affecting manual
      # recording or rover controls. Enable only after scheduler readiness.
      RECORDING_SCHEDULER_ENABLED: "${RECORDING_SCHEDULER_ENABLED:-false}"
      RECORDING_SCHEDULE_QUEUE_CAPACITY: "${RECORDING_SCHEDULE_QUEUE_CAPACITY:-64}"
      RECORDING_SCHEDULE_REQUEST_TIMEOUT_SECONDS: "${RECORDING_SCHEDULE_REQUEST_TIMEOUT_SECONDS:-15}"
      # A missing scheduler status expires closed. The scheduler validates this
      # is at least twice its reconciliation interval before it starts.
      RECORDING_SCHEDULER_READY_LEASE_SECONDS: "${RECORDING_SCHEDULER_READY_LEASE_SECONDS:-90}"

      # Input Validation
      MAX_TTS_TEXT_LENGTH: "1000"
      MAX_AUDIO_SAMPLES_PER_MESSAGE: "16000"
      MAX_WHEEL_VELOCITY: "2.0"
      TTS_DEFAULT_LANGUAGE: "${TTS_DEFAULT_LANGUAGE:-en}"
      TTS_DEFAULT_SPEAKER_ID: "${TTS_DEFAULT_SPEAKER_ID:-5}"
      TTS_DEFAULT_SPEED: "${TTS_DEFAULT_SPEED:-1.0}"
      TTS_DEFAULT_STEPS: "${TTS_DEFAULT_STEPS:-8}"
      TTS_DEFAULT_VOLUME: "${TTS_DEFAULT_VOLUME:-0.8}"

      # Security
      ENABLE_AUDIT_LOGGING: "true"
      LOG_AUTH_ATTEMPTS: "true"

      # Fleet Management
      SELECTED_ENTITY_ID: "rover-kiwi"   # Default selected rover
      FLEET_ROSTER: "rover-kiwi,rover-a,rover-b"
