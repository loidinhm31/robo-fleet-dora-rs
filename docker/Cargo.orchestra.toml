[workspace]
resolver = "2"
members = [
    # Shared library
    "robo_rover_lib",

    # Common - Multi-target nodes (orchestra + rover)
    "common/web_bridge",
    "common/lifecycle_manager",
    "common/power-coordinator",
    "common/resource_monitor",

    # Orchestra (Workstation) - Fleet control hub
    "orchestra/central_speech_recognizer",
    "orchestra/command_parser",
    "orchestra/media_recorder",
    "orchestra/recording_scheduler",
    "orchestra/power-event-projector",
    "orchestra/zenoh_bridge",
]

[workspace.dependencies]
# Shared dependencies across all workspace members
dora-node-api = "0.5.0"
dora-core = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
nalgebra = "0.33"
eyre = "0.6.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "v5"] }
chrono-tz = "0.10"
crossbeam-channel = "0.5"
libc = "0.2"
os_pipe = "1.2"
zenoh = "1.0"
zenoh-config = "1.0"
