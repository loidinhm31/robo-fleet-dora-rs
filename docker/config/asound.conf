# ALSA configuration for rover-kiwi container
# Capture : USB mic  — "PC-LM1E Camera" (arecord -l shows: card 2: Camera)
# Playback : default output (hw:0,0)
#
# Card referenced by NAME ("Camera") not number so it survives reboots.
# If the card name changes, update the 'card' field below, or override
# via the AUDIO_CAPTURE_CARD env var passed into the container.

pcm.usbmic {
    type hw
    card Camera    # short name from arecord -l (card N: <short> [long])
    device 0
}

ctl.usbmic {
    type hw
    card Camera
}

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "hw:0,0"
    }
    capture.pcm {
        type plug
        slave.pcm "usbmic"
    }
}
