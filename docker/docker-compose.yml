version: '3.8'

services:
  mongodb:
    profiles: ["mongodb"]
    image: mongo:8.0
    container_name: robo-mongodb
    hostname: mongodb
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-dev-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet mongodb://127.0.0.1:27017/admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ===========================================================================
  # ORCHESTRA PROFILE - Runs on Workstation (x86_64)
  # ===========================================================================
  orchestra:
    profiles: ["orchestra"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.orchestra
    container_name: robo-orchestra
    hostname: orchestra
    network_mode: host
    volumes:
      - ${HOST_WORKSPACE:-..}/models/.cache/sherpa-onnx:/models/sherpa-onnx:ro
      - ${HOST_WORKSPACE:-..}/orchestra/zenoh_bridge/zenoh_config.json5:/app/config/zenoh_config.json5:ro
      - type: bind
        source: ${HOST_RECORDING_PATH:?HOST_RECORDING_PATH must point to an existing dedicated directory below /home}
        target: /recordings
        bind:
          create_host_path: false
          selinux: Z
      # - ${HOST_WORKSPACE:-..}/orchestra/orchestra-dataflow.yml:/app/dataflow/orchestra-dataflow.yml:ro
    environment:
      RUST_LOG: info
      ZENOH_MODE: peer
      ZENOH_CONFIG: /app/config/zenoh_config.json5
      ENTITY_ID: orchestra
      ACTIVE_ROVERS: rover-kiwi
      VIDEO_WIDTH: "640"
      VIDEO_HEIGHT: "480"
      AUDIO_SAMPLE_RATE: "16000"
      AUDIO_CHANNELS: "1"
      STT_PROFILE: ${STT_PROFILE:-en-vad-offline}
      STT_MODEL_ROOT: /models/sherpa-onnx/asr
      STT_NUM_THREADS: ${STT_NUM_THREADS:-2}
      MODE: orchestra
      ZENOH_ENABLED: "false"
      BIND_ADDRESS: "0.0.0.0"
      SOCKET_IO_PORT: "3030"
      MONGODB_URI: ${MONGODB_URI:-mongodb://127.0.0.1:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-gleanOak}
      JWT_SECRET: ${JWT_SECRET:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      ALLOW_DEFAULT_CREDENTIALS: ${ALLOW_DEFAULT_CREDENTIALS:-false}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://dms-study.cloud,http://localhost:1420,http://localhost:3000,http://localhost:5173}"
      RATE_LIMIT_AUTH_PER_MINUTE: "5"
      RATE_LIMIT_COMMANDS_PER_SECOND: "100"
      MAX_TTS_TEXT_LENGTH: "1000"
      MAX_AUDIO_SAMPLES_PER_MESSAGE: "16000"
      MAX_WHEEL_VELOCITY: "2.0"
      ENABLE_AUDIT_LOGGING: "true"
      LOG_AUTH_ATTEMPTS: "true"
      SELECTED_ENTITY_ID: ${SELECTED_ENTITY_ID:-rover-kiwi}
      FLEET_ROSTER: ${FLEET_ROSTER:-rover-kiwi}
      HOST_RECORDING_PATH: ${HOST_RECORDING_PATH:?HOST_RECORDING_PATH must point to an existing dedicated directory below /home}
      RECORDING_CONTAINER_MODE: "true"
      RECORDING_ROOT: /recordings
      RECORDING_MAX_CONCURRENT: ${RECORDING_MAX_CONCURRENT:-64}
      RECORDING_MAX_DURATION_SECONDS: ${RECORDING_MAX_DURATION_SECONDS:-3600}
      RECORDING_MAX_OUTPUT_BYTES: ${RECORDING_MAX_OUTPUT_BYTES:-4294967296}
      RECORDING_STARTUP_TIMEOUT_SECONDS: ${RECORDING_STARTUP_TIMEOUT_SECONDS:-10}
      RECORDING_FINALIZATION_TIMEOUT_SECONDS: ${RECORDING_FINALIZATION_TIMEOUT_SECONDS:-15}
      RECORDING_MIN_FREE_BYTES: ${RECORDING_MIN_FREE_BYTES:-1073741824}
      RECORDING_QUEUE_CAPACITY: ${RECORDING_QUEUE_CAPACITY:-8}
      RECORDING_AUDIO_SAMPLE_RATE: ${RECORDING_AUDIO_SAMPLE_RATE:-16000}
      RECORDING_AUDIO_CHANNELS: ${RECORDING_AUDIO_CHANNELS:-1}
      RECORDING_VIDEO_FPS: ${RECORDING_VIDEO_FPS:-30}
      # Schedule CRUD is disabled by default for staged rollout. Existing
      # manual recording is independent of this switch.
      RECORDING_SCHEDULER_ENABLED: ${RECORDING_SCHEDULER_ENABLED:-false}
      RECORDING_SCHEDULER_HORIZON_DAYS: ${RECORDING_SCHEDULER_HORIZON_DAYS:-35}
      RECORDING_SCHEDULER_MAX_FUTURE_DAYS: ${RECORDING_SCHEDULER_MAX_FUTURE_DAYS:-365}
      RECORDING_SCHEDULER_MAX_SCHEDULES_PER_ENTITY: ${RECORDING_SCHEDULER_MAX_SCHEDULES_PER_ENTITY:-100}
      RECORDING_SCHEDULER_RECONCILE_SECONDS: ${RECORDING_SCHEDULER_RECONCILE_SECONDS:-30}
      RECORDING_SCHEDULE_QUEUE_CAPACITY: ${RECORDING_SCHEDULE_QUEUE_CAPACITY:-64}
      RECORDING_SCHEDULE_REQUEST_TIMEOUT_SECONDS: ${RECORDING_SCHEDULE_REQUEST_TIMEOUT_SECONDS:-15}
      RECORDING_SCHEDULER_READY_LEASE_SECONDS: ${RECORDING_SCHEDULER_READY_LEASE_SECONDS:-90}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test ! -e /recordings/.image-layer-recording-root-marker && test -d /recordings && test -w /recordings && test -x /usr/bin/ffmpeg && test -x /usr/bin/ffprobe && ffmpeg -hide_banner -encoders 2>/dev/null | grep -Eq '[[:space:]]libx264[[:space:]]' && ffmpeg -hide_banner -encoders 2>/dev/null | grep -Eq '[[:space:]]aac[[:space:]]' && ffmpeg -hide_banner -muxers 2>/dev/null | grep -Eq '[[:space:]]E[[:space:]]mp4[[:space:]]' && ffprobe -version >/dev/null 2>&1 && available_kb=$$(df -Pk /recordings | awk 'NR==2 {print $$4}') && test \"$$available_kb\" -ge \"$$((RECORDING_MIN_FREE_BYTES / 1024))\" && probe=$$(mktemp /recordings/.healthcheck.XXXXXX) && printf ready > \"$$probe\" && sync -f \"$$probe\" && mv \"$$probe\" \"$$probe.renamed\" && test \"$$(cat \"$$probe.renamed\")\" = ready && rm -f \"$$probe.renamed\" && grep -azq '/app/bin/central_speech_recognizer' /proc/*/cmdline && grep -azq '/app/bin/command_parser' /proc/*/cmdline && grep -azq '/app/bin/media_recorder' /proc/*/cmdline && grep -azq '/app/bin/orchestra_zenoh_bridge' /proc/*/cmdline && grep -azq '/app/bin/web_bridge' /proc/*/cmdline && { test \"$$RECORDING_SCHEDULER_ENABLED\" != true || grep -azq '/app/bin/recording_scheduler' /proc/*/cmdline; }",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # ROVER-KIWI PROFILE - Runs on Raspberry Pi 5 (ARM64)
  # ===========================================================================
  rover-kiwi:
    profiles: ["rover-kiwi"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.rover-kiwi
    container_name: robo-rover-kiwi
    hostname: rover-kiwi
    platform: ${ROVER_PLATFORM:-linux/arm64}
    network_mode: host
    privileged: true
    ipc: host
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ${HOST_WORKSPACE:-..}/models/.cache/yolo:/models/yolo:ro
      - ${HOST_WORKSPACE:-..}/models/.cache/reid:/models/reid:ro
      - ${HOST_WORKSPACE:-..}/models/.cache/sherpa-onnx:/models/sherpa-onnx:ro
      - ${HOST_WORKSPACE:-..}/rover-kiwi/zenoh_bridge/zenoh_config.json5:/app/config/zenoh_config.json5:ro
      - ${HOST_WORKSPACE:-..}/rover-kiwi/config:/app/config/rover:ro
      - ${HOST_WORKSPACE:-..}/rover-kiwi/rover-kiwi-dataflow.yml:/app/dataflow/rover-kiwi-dataflow.yml:ro
      - ${HOST_WORKSPACE:-..}/rover-kiwi/rover-kiwi-direct-dataflow.yml:/app/dataflow/rover-kiwi-direct-dataflow.yml:ro
      - /run/user/${PULSE_UID:-1000}/pulse:/run/user/${PULSE_UID:-1000}/pulse
    environment:
      RUST_LOG: info
      ROVER_MODE: ${ROVER_MODE:-zenoh}
      ENTITY_ID: ${ENTITY_ID:-rover-kiwi}
      ZENOH_MODE: peer
      ZENOH_CONFIG: /app/config/zenoh_config.json5
      BIND_ADDRESS: "0.0.0.0"
      SOCKET_IO_PORT: "3030"
      MONGODB_URI: ${MONGODB_URI:-mongodb://127.0.0.1:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-gleanOak}
      JWT_SECRET: ${JWT_SECRET:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      ALLOW_DEFAULT_CREDENTIALS: ${ALLOW_DEFAULT_CREDENTIALS:-false}
      SOURCE_TYPE: ${SOURCE_TYPE:-webcam}
      SOURCE_URI: ${SOURCE_URI:-/dev/video0}
      IMAGE_COLS: "640"
      IMAGE_ROWS: "480"
      SOURCE_FPS: "30"
      VIEW_STREAM_FPS: "15"
      MODEL_PATH: /models/yolo/yolo12n.onnx
      CONFIDENCE_THRESHOLD: ${YOLO_CONFIDENCE:-0.5}
      NMS_THRESHOLD: "0.4"
      TARGET_CLASSES: ""
      ORT_DYLIB_PATH: ${ROVER_ORT_DYLIB_PATH:-/usr/local/lib/libonnxruntime.so}
      REID_MODEL_PATH: /models/reid/osnet_x0_25.onnx
      MIN_BBOX_SIZE: "32"
      MAX_TRACKING_AGE: "50"
      MIN_HITS: "3"
      IOU_THRESHOLD: "0.3"
      REID_WEIGHT: "0.8"
      REID_THRESHOLD: "0.5"
      ENABLE_CMC: "true"
      LATERAL_PID_KP: "1.5"
      LATERAL_PID_KI: "0.0"
      LATERAL_PID_KD: "0.2"
      LONGITUDINAL_PID_KP: "0.8"
      LONGITUDINAL_PID_KI: "0.0"
      LONGITUDINAL_PID_KD: "0.15"
      MIN_DISTANCE: "1.0"
      MAX_VELOCITY: "0.5"
      MAX_ANGULAR_VELOCITY: "1.0"
      TARGET_BBOX_HEIGHT: "0.3"
      DEAD_ZONE: "0.05"
      SAMPLE_RATE: "16000"
      CHANNELS: "1"
      CHUNK_SIZE: "800"
      XDG_RUNTIME_DIR: "/run/user/${PULSE_UID:-1000}"
      PULSE_SERVER: "unix:/run/user/${PULSE_UID:-1000}/pulse/native"
      EDGE_VOICE_MODEL_DIR: /models/sherpa-onnx/tts/sherpa-onnx-supertonic-3-tts-int8-2026-05-11
      EDGE_VOICE_NUM_THREADS: "2"
      EDGE_VOICE_QUEUE_CAPACITY: "8"
      TTS_DEFAULT_VOLUME: "0.8"
      TTS_DEFAULT_SPEED: "1.0"
      LD_LIBRARY_PATH: "/usr/local/lib:/app/bin"
      ARM_CONFIG: /app/config/rover/arm_6dof.toml
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -azq '/app/bin/kornia_capture' /proc/*/cmdline && grep -azq '/app/bin/edge_voice' /proc/*/cmdline && grep -azq '/app/bin/audio_capture' /proc/*/cmdline && grep -azq '/app/bin/audio_playback' /proc/*/cmdline && grep -azq '/app/bin/rover_zenoh_bridge' /proc/*/cmdline",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mongodb-dev-data:
