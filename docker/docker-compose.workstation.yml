services:
  orchestra:
    image: localhost/robo-orchestra:latest
    platform: linux/amd64
    depends_on:
      mongodb:
        condition: service_healthy
    build:
      platforms:
        - linux/amd64
    cpus: 2.0
    mem_limit: 3g
    environment:
      MONGODB_URI: "${WORKSTATION_MONGODB_URI:-mongodb://127.0.0.1:27017}"
      MONGODB_DATABASE: "${WORKSTATION_MONGODB_DATABASE:-robo_fleet_edge_voice_e2e}"
      ALLOW_DEFAULT_CREDENTIALS: "${WORKSTATION_ALLOW_DEFAULT_CREDENTIALS:-true}"
      ORCHESTRA_ZENOH_LISTEN_ENDPOINT: "${WORKSTATION_ORCHESTRA_ZENOH_LISTEN_ENDPOINT:-tcp/127.0.0.1:7448}"

  rover-kiwi:
    image: localhost/robo-rover-kiwi:latest
    platform: linux/amd64
    depends_on:
      mongodb:
        condition: service_healthy
    build:
      platforms:
        - linux/amd64
    cpus: 3.0
    mem_limit: 4g
    group_add:
      - keep-groups
    environment:
      MONGODB_URI: "${WORKSTATION_MONGODB_URI:-mongodb://127.0.0.1:27017}"
      MONGODB_DATABASE: "${WORKSTATION_MONGODB_DATABASE:-robo_fleet_edge_voice_e2e}"
      ALLOW_DEFAULT_CREDENTIALS: "${WORKSTATION_ALLOW_DEFAULT_CREDENTIALS:-true}"
      ROVER_ZENOH_CONNECT_ENDPOINT: "${WORKSTATION_ROVER_ZENOH_CONNECT_ENDPOINT:-tcp/127.0.0.1:7448}"
      AUDIO_DEVICE: "${WORKSTATION_AUDIO_DEVICE:-sysdefault:CARD=Camera}"
