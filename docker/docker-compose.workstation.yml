services:
  orchestra:
    image: localhost/robo-orchestra:latest
    platform: linux/amd64
    depends_on:
      mongodb:
        condition: service_healthy
    build:
      platforms:
        - linux/amd64
    cpus: 2.0
    mem_limit: 3g
    environment:
      MONGODB_URI: "${WORKSTATION_MONGODB_URI:-mongodb://127.0.0.1:27017}"
      MONGODB_DATABASE: "${WORKSTATION_MONGODB_DATABASE:-robo_fleet_edge_voice_e2e}"
      ALLOW_DEFAULT_CREDENTIALS: "${WORKSTATION_ALLOW_DEFAULT_CREDENTIALS:-false}"

  rover-kiwi:
    image: localhost/robo-rover-kiwi:latest
    platform: linux/amd64
    depends_on:
      mongodb:
        condition: service_healthy
    build:
      platforms:
        - linux/amd64
    cpus: 3.0
    mem_limit: 4g
    environment:
      MONGODB_URI: "${WORKSTATION_MONGODB_URI:-mongodb://127.0.0.1:27017}"
      MONGODB_DATABASE: "${WORKSTATION_MONGODB_DATABASE:-robo_fleet_edge_voice_e2e}"
      ALLOW_DEFAULT_CREDENTIALS: "${WORKSTATION_ALLOW_DEFAULT_CREDENTIALS:-false}"
